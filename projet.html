<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projet · Pedro Firmino</title>
    <meta name="description" content="Un projet de Pedro Firmino, développeur à Rouen." data-en-content="A project by Pedro Firmino, developer in Rouen, France." />
    <meta name="theme-color" content="#F1F4F0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gochi+Hand&family=Josefin+Sans:ital,wght@0,300..700;1,300..700&family=Ubuntu+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const t = localStorage.getItem('theme');
        if (t) document.documentElement.dataset.theme = t;
        const l = localStorage.getItem('lang') || (navigator.language.toLowerCase().startsWith('fr') ? 'fr' : 'en');
        if (l === 'en') document.documentElement.lang = 'en';
      } catch {}
    </script>
  </head>
  <body id="top">
    <main id="main" tabindex="-1"></main>
    <script type="module" src="/src/pages/project.ts"></script>
  </body>
</html>
