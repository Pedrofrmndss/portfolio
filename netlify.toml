# Netlify : construit le site et publie le dossier dist.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La carte de visite (/carte/) ne doit pas apparaître dans les moteurs de recherche.
[[headers]]
  for = "/carte/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
